<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Dashboard</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Embedded CSS -->
    <style>
      body {
        background-color: #f4f7ff;
        font-family: 'Segoe UI', sans-serif;
      }

      .navbar {
        padding: 1rem 2rem;
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 1.5rem;
      }

      h2 {
        margin-bottom: 1rem;
        color: #2c3e50;
      }

      #container {
        background-color: #e6ecff;
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      #task-form .form-group {
        margin-bottom: 1rem;
      }

      #task-container {
        background-color: #ffffff;
        padding: 1.5rem;
        border-radius: 10px;
        border: 1px solid #d0d7ff;
      }

      .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
      }

      .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2653d4;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <!-- Navbar -->
      <nav class="navbar" style="background-color: #ccd8ff;">
        <a class="navbar-brand" href="#">Faculty Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Tasks</a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="container mt-4">
        <div class="row">
          <!-- Task Display -->
          <div class="col-md-8">
            <h2>Home</h2>
            <div id="task-container">
              <p class="text-center"><em>No tasks have been assigned.</em></p>
            </div>
          </div>

          <!-- Task Form -->
          <div class="col-md-4" id="container">
            <h2>Add Task</h2>
            <form id="task-form">
              <div class="form-group">
                <label for="year">Year:</label>
                <select class="form-control" id="year">
                  <option value="">Select Year</option>
                  <option>2023</option>
                  <option>2024</option>
                  <option>2025</option>
                </select>
              </div>
              <div class="form-group">
                <label for="month">Month:</label>
                <select class="form-control" id="month">
                  <option value="">Select Month</option>
                  <option>January</option>
                  <option>February</option>
                  <option>March</option>
                  <option>April</option>
                  <option>May</option>
                  <option>June</option>
                  <option>July</option>
                  <option>August</option>
                  <option>September</option>
                  <option>October</option>
                  <option>November</option>
                  <option>December</option>
                </select>
              </div>
              <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" class="form-control" id="title" placeholder="Enter task title">
              </div>
              <div class="form-group">
                <label for="upload">Upload File:</label>
                <input type="file" class="form-control-file" id="upload">
              </div>
              <button type="submit" class="btn btn-primary mt-3">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
